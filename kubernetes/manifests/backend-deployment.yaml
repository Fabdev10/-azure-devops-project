apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        image: <il-tuo-acr-login-server>/backend:v1
        ports:
        - containerPort: 3000
        env:
        - name: PORT
          value: "3000"
        # Example for later DB connection:
        # - name: DB_HOST
        #   value: "my-flexible-server.postgres.database.azure.com"
        # - name: DB_USER
        #   value: "postgres"
        # - name: DB_PASSWORD
        #   value: "password"
        # - name: DB_NAME
        #   value: "postgres"
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 200m
            memory: 256Mi
        livenessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 10
