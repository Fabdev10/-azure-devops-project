<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimal Demo App</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #f8f9fa; margin: 0; }
        .card { background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); text-align: center; }
        button { background-color: #007bff; color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; font-size: 16px; margin-top: 15px; }
        button:hover { background-color: #0056b3; }
        #message { margin-top: 1.5rem; font-weight: bold; color: #28a745; min-height: 24px; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Frontend Demo</h1>
        <p>Testing connection to backend...</p>
        <button id="fetchBtn">Fetch /api/hello</button>
        <p id="message"></p>
    </div>
    <script>
        document.getElementById('fetchBtn').addEventListener('click', async () => {
            const msgEl = document.getElementById('message');
            msgEl.textContent = 'Loading...';
            msgEl.style.color = '#6c757d';
            try {
                const res = await fetch('/api/hello');
                if (!res.ok) throw new Error(`HTTP error! status: ${res.status}`);
                const data = await res.json();
                msgEl.textContent = data.message;
                msgEl.style.color = '#28a745';
            } catch (e) {
                msgEl.textContent = 'Error: ' + e.message;
                msgEl.style.color = '#dc3545';
            }
        });
    </script>
</body>
</html>
